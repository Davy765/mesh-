name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python -m unittest discover -s tests -v
      - name: Quick demo run
        run: timeout 300 python simulate_mesh.py --rounds 20

  network:
    # The real thing: 21 separate processes talking over sockets, with a server and a validator
    # killed halfway and restarted later. Runs once over raw TCP and once over HTTP.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        carrier: ["", "--http"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run a 12-round network
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          timeout 600 python -m mesh.run local --rounds 12 --interval 1.5 --dir net-ci ${{ matrix.carrier }} | tee out.txt
          grep -q "node errors logged: 0" out.txt
          grep -q "validator3 after its restart: replayed_blocks=" out.txt
          grep -q "server0.1 after its restart: .*resynced=True" out.txt
          grep -Eq "training rounds: [0-9]+, accepted [1-9]" out.txt
      - name: Keep the node logs if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: net-ci/logs/
          retention-days: 7

  cluster-rehearsal:
    # The multi-machine code path (per-machine keys, card exchange through machine 0, cross-machine report),
    # with three "machines" on one runner. The real thing runs in the multi-machine workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Three machines, one runner
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          for m in 0 1 2; do
            timeout 600 python -m mesh.run cluster --machine $m --machines 3 --my-host 127.0.0.1 \
              --coordinator 127.0.0.1:9000 --rounds 10 --interval 1.5 --dir net-m$m > m$m.out 2>&1 &
          done
          wait
          cat m0.out m1.out m2.out
          for m in 0 1 2; do grep -q "machine $m: node errors logged: 0" m$m.out; done
          grep -q "honest servers outvoted: none" m0.out
          grep -Eq "training rounds: [0-9]+, accepted [1-9]" m0.out
      - name: Keep the node logs if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: net-m*/logs/
          retention-days: 7

  docker:
    # The image a test network's servers run (see deploy/TESTNET.md): it must build and run commands.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mesh .
      - name: Run commands inside the image
        run: |
          docker run --rm mesh keygen --keys /tmp/k --name v0 --role validator --endpoint 1.2.3.4:9100 | grep -q '"sign_pk"'
          docker run --rm mesh --help | grep -q join

  testnet-rehearsal:
    # The public test network on one runner: faucet, status page, and a new agent and validator joining mid-run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rehearse
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          timeout 600 python -m mesh.run local --testnet --rounds 20 --interval 1.5 --dir net-tn | tee out.txt
          grep -q "newcomer-agent: registered, active" out.txt
          grep -q "newcomer-validator: in the validator set" out.txt
          grep -q "node errors logged: 0" out.txt
          ! grep -h '"error"' net-tn/logs/newcomer*.log
      - name: Keep the node logs if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: net-tn/logs/
          retention-days: 7
